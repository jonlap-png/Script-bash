
version: "3.8"

services:

  pushgateway:
    image: prom/pushgateway:latest
    container_name: lapshin-el-netology-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped
    networks:
      - lapshin-el-my-netology-hw

  prometheus:
    image: prom/prometheus:latest
    container_name: lapshin-el-netology-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - pushgateway
    restart: unless-stopped
    networks:
      - lapshin-el-my-netology-hw

  grafana:
    image: grafana/grafana:latest
    container_name: lapshin-el-netology-grafana
    ports:
      - "80:3000"
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/custom.ini
    volumes:
      - ./grafana/custom.ini:/etc/grafana/custom.ini:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lapshin-el-my-netology-hw

volumes:
  prometheus_data:
  grafana_data:

networks:
  lapshin-el-my-netology-hw:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
